<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{NEWSLETTER_TITLE}}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        .newsletter-container {
            width: 80%;
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            padding: 20px;
            border: 1px solid #dddddd;
            border-radius: 5px;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        h3 {
            color: #3498db;
            margin-top: 0; /* Reset margin for h3 inside article div */
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .article {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eeeeee;
        }
        .article:last-child {
            border-bottom: none;
        }
        .article-url {
            font-size: 0.9em;
            color: #7f8c8d;
        }
        .intro-text {
            margin-bottom: 25px;
            font-size: 1.1em;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.8em;
            color: #7f8c8d;
        }
    </style>
</head><body>
    <div class="newsletter-container">
        <header>
            <h1>{{NEWSLETTER_TITLE}}</h1>
        </header>

        <!-- Optional Intro Text Placeholder -->
        <!-- To use, replace this comment and the one below with:
        <div class="intro-text">
            <p>{{INTRO_TEXT}}</p>
        </div>
        -->
        <!-- {{OPTIONAL_INTRO_TEXT_START}} -->
        <!-- {{OPTIONAL_INTRO_TEXT_END}} -->

        <main>
            <h2>Latest Articles:</h2>
            <!-- Placeholder for the list of articles -->
            <!-- The Python script will replace this comment block with actual article HTML -->
            <!-- Example structure for a single article (to be generated by Python script):
            <div class="article">
                <h3><a href="{{ARTICLE_URL}}">{{ARTICLE_HEADLINE}}</a></h3>
                <!-- Optional: <p>{{ARTICLE_SUMMARY}}</p> -->
                <!-- Optional: <p class="article-source">Source: {{ARTICLE_SOURCE}}</p> -->
            <!-- </div>
            -->
            <!-- {{ARTICLES_LIST_START}} -->
            <!-- This will be dynamically populated -->
            <!-- {{ARTICLES_LIST_END}} -->
        </main>

        <footer class="footer">
            <p>&copy; {{CURRENT_YEAR}} Taxation News Digest. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
